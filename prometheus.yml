global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # Bài 3: bỏ chú thích và sửa target nếu đã chạy ứng dụng Spring Boot.
  # Trên Windows/macOS Docker Desktop, ví dụ Spring Boot chạy trên máy host :8080.
  # - job_name: spring-boot
  #   metrics_path: /actuator/prometheus
  #   static_configs:
  #     - targets: ["host.docker.internal:8080"]
